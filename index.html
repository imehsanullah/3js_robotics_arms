<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RobotArm Web</title>
  </head>
  <body>
    <div id="app-shell">
      <header class="topbar">
        <div class="brand">
          <span id="brand-name">UR5e</span>
          <small id="brand-subtitle">Browser robot physics</small>
        </div>
        <nav class="toolbar" aria-label="Robot controls">
          <label class="robot-picker" title="Robot model">
            <span class="sr-only">Robot model</span>
            <select id="robot-selector"></select>
          </label>
          <button class="icon-button" id="zero-button" type="button" title="Zero joints">
            <i data-lucide="crosshair"></i>
            <span class="sr-only">Zero joints</span>
          </button>
          <button class="icon-button" id="home-button" type="button" title="Ready pose">
            <i data-lucide="home"></i>
            <span class="sr-only">Ready pose</span>
          </button>
          <button class="icon-button" id="fold-button" type="button" title="Folded pose">
            <i data-lucide="rotate-ccw"></i>
            <span class="sr-only">Folded pose</span>
          </button>
          <button class="icon-button" id="play-button" type="button" title="Play joint motion">
            <i data-lucide="play"></i>
            <span class="sr-only">Play joint motion</span>
          </button>
          <button class="icon-button" id="camera-button" type="button" title="Reset camera">
            <i data-lucide="camera"></i>
            <span class="sr-only">Reset camera</span>
          </button>
        </nav>
      </header>

      <div class="workbench">
        <aside class="panel joint-panel" aria-label="Joint controls">
          <section class="panel-section">
            <div class="section-heading">
              <h1>Joint Control</h1>
              <output id="motion-state">Loading</output>
            </div>
            <div id="joint-controls" class="joint-controls"></div>
          </section>

          <section class="panel-section">
            <div class="section-heading">
              <h2>Gripper</h2>
              <output id="gripper-state">Loading</output>
            </div>
            <div id="gripper-controls" class="gripper-controls"></div>
          </section>

        </aside>

        <main class="viewport" aria-label="Robot 3D viewport">
          <canvas id="scene"></canvas>
          <div class="hud top-hud">
            <span id="asset-state">Loading URDF</span>
            <span id="collision-state">Collision: pending</span>
          </div>
          <div class="hud pose-hud" id="pose-hud">Tool pose unavailable</div>
        </main>

        <aside class="panel physics-panel" aria-label="Robot state and controls">
          <section class="panel-section">
            <div class="section-heading">
              <h2>Robot State</h2>
              <span class="status-pill" id="robot-ready">Pending</span>
            </div>
            <dl class="metrics-grid">
              <div>
                <dt>Total mass</dt>
                <dd id="mass-output">-- kg</dd>
              </div>
              <div>
                <dt>Tool reach</dt>
                <dd id="reach-output">-- m</dd>
              </div>
              <div>
                <dt>COM height</dt>
                <dd id="com-output">-- m</dd>
              </div>
              <div>
                <dt>Meshes</dt>
                <dd id="mesh-output">--</dd>
              </div>
            </dl>
          </section>

          <section class="panel-section">
            <div class="section-heading">
              <h2>Target</h2>
              <button class="text-button" id="solve-ik-button" type="button">
                <i data-lucide="target"></i>
                Solve IK
              </button>
            </div>
            <div id="target-controls" class="target-controls"></div>
          </section>

          <section class="panel-section">
            <div class="section-heading">
              <h2>Move Group</h2>
              <output id="move-group-state">Idle</output>
            </div>
            <div class="move-group-controls">
              <button class="text-button" id="move-ready-button" type="button">
                <i data-lucide="home"></i>
                Ready
              </button>
              <button class="text-button" id="move-reach-button" type="button">
                <i data-lucide="route"></i>
                Reach
              </button>
              <button class="text-button" id="move-target-button" type="button">
                <i data-lucide="send"></i>
                Target
              </button>
              <button class="text-button danger-button" id="move-stop-button" type="button">
                <i data-lucide="circle-stop"></i>
                Stop
              </button>
            </div>
          </section>

          <section class="panel-section">
            <div class="section-heading">
              <h2>Scene</h2>
            </div>
            <label class="toggle-row">
              <input id="collision-toggle" type="checkbox" checked />
              <span>Collision mesh</span>
            </label>
            <label class="toggle-row">
              <input id="com-toggle" type="checkbox" />
              <span>Center of mass</span>
            </label>
            <label class="toggle-row">
              <input id="frames-toggle" type="checkbox" checked />
              <span>Tool frame</span>
            </label>
            <label class="range-row">
              <span>Motion scale</span>
              <input id="speed-scale" type="range" min="0.15" max="2.5" step="0.05" value="1" />
              <output id="speed-scale-output">1.00x</output>
            </label>
          </section>
        </aside>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

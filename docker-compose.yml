services:
  app:
    build:
      context: .
    image: threejs-robotics-arms:dev
    working_dir: /app
    command: npm run dev -- --port 5173
    ports:
      - "${APP_PORT:-5174}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

volumes:
  node_modules:
